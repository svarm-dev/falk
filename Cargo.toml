[workspace]
resolver = "3"
members = [
    "crates/falk-cli",
    "crates/falk-config",
    "crates/falk-pty",
    "crates/falk-security",
    "crates/falk-finops",
    "crates/falk-telemetry",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["falk contributors"]
repository = "https://github.com/svarm-dev/falk"
description = "Standalone PTY runtime sentinel and opt-in Svärm FinOps circuit breaker for AI coding agents"

[workspace.dependencies]
falk-config = { path = "crates/falk-config" }
falk-pty = { path = "crates/falk-pty" }
falk-security = { path = "crates/falk-security" }
falk-finops = { path = "crates/falk-finops" }
falk-telemetry = { path = "crates/falk-telemetry" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
nix = { version = "0.30", features = ["process", "signal", "term", "fs"] }
regex = "1.11"
aho-corasick = "1.1"
rust_decimal = { version = "1.37", features = ["serde"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
crossterm = "0.29"
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Honored lints stay on. These pedantic/doc lints are noise for this crate
# surface (pid/pgid, Result wrappers, FinOps in docs).
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
assigning_clones = "allow"
derivable_impls = "allow"
redundant_guards = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
needless_continue = "allow"
while_let_loop = "allow"
redundant_closure_for_method_calls = "allow"
manual_contains = "allow"
