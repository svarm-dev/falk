# Wrappers for Svärm Runner.Cli.
#
# `load_agents/1` reads `[agent.<name>]`. `[agents.*]` loads as an empty map.
# Runner.Cli does not expand `${...}` and does not set `FALK_RUN_ID`.
# `run-1` and `task-9` are literal argv. Svärm does not inject the live ids.

[agent.claude]
command = "falk"
args = [
    "--svarm",
    "--run-id", "run-1",
    "--task-id", "task-9",
    "--ndjson", "falk-events.ndjson",
    "--hard-limit", "2.50",
    "--",
    "claude",
]

[agent.aider]
command = "falk"
args = [
    "--svarm",
    "--run-id", "run-1",
    "--task-id", "task-9",
    "--ndjson", "falk-events.ndjson",
    "-c", "falk.toml",
    "--",
    "aider",
    "--yes-always",
]

[agent.codex]
command = "falk"
args = [
    "--svarm",
    "--run-id", "run-1",
    "--task-id", "task-9",
    "--ndjson", "falk-events.ndjson",
    "--",
    "codex",
]
